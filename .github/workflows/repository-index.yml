name: Repository index

# `peppy_repository.json5` states what this repository publishes: the
# `mcp_exposure/v1` documents a launcher can list. It is generated, so a pull
# request that adds, moves, renames or deletes an exposure leaves it stale
# unless the author regenerates it, and a stale index makes an exposure
# silently invisible to every machine that consumes this repository. The
# exposures themselves reference contracts that live in the contracts hub;
# an exposure selecting a member its contract does not declare, or breaking
# a policy rule, would only fail at launch. Both are caught here, on the
# branch of the person who caused them.
#
# It runs on every pull request rather than behind a path filter: a removal
# or a rename drifts the index just as an addition does.
on:
  pull_request:

concurrency:
  group: repository-index-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-index:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The runners are shared, so a step that hangs holds one hostage. Nothing
    # here legitimately takes minutes.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Nothing here pushes, so the job has no use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # Installed under RUNNER_TEMP rather than through scripts/install.sh:
      # the self-hosted runners are reused, so this run must not touch a
      # shared ~/.peppy. The whole release archive is extracted, because
      # resolving the contracts the exposures reference takes a daemon
      # (`peppy repo refresh` runs in one), and the daemon needs its bundled
      # router beside the binary. Set the PEPPY_VERSION repository variable
      # to pin a release; it defaults to the latest.
      #
      # PEPPY_VERSION reaches the script through the environment rather than a
      # `${{ }}` expansion, so its value is data the shell reads instead of
      # source the shell parses, and the shape check turns a typo into a named
      # failure rather than a 404 from a URL built out of it.
      - name: Install peppy
        env:
          PEPPY_VERSION: ${{ vars.PEPPY_VERSION }}
        run: |
          set -euo pipefail
          version="${PEPPY_VERSION:-latest}"
          if [[ "$version" == "latest" ]]; then
            channel="latest"
          elif [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel="v${version#v}"
          else
            echo "PEPPY_VERSION must be 'latest' or a release such as 0.20.0, got: $version" >&2
            exit 1
          fi

          case "$(uname -m)" in
            x86_64 | amd64) arch="x86_64" ;;
            aarch64 | arm64) arch="aarch64" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          dest="$RUNNER_TEMP/peppy-install"
          mkdir -p "$dest"
          curl -fsSL --connect-timeout 10 --max-time 300 \
            "https://peppy.bot/$channel/peppy-$arch-unknown-linux-gnu.tgz" \
            | tar -xzf - -C "$dest"
          chmod +x "$dest/bin/peppy"
          echo "$dest/bin" >> "$GITHUB_PATH"

          installed="Installed $("$dest/bin/peppy" --version) (channel: $channel)"
          printf '\n%s\n' "$installed" | tee -a "$GITHUB_STEP_SUMMARY"

      # The daemon gets its own data root and port under RUNNER_TEMP: the CLI
      # finds it through PEPPY_HOME/daemon_state.json5, so pointing PEPPY_HOME
      # at the run's directory is discovery and isolation from any other
      # daemon in one. The name carries the run id because core-node names
      # must be unique among daemons that can reach each other.
      - name: Start an isolated peppy daemon
        run: |
          set -euo pipefail
          PEPPY_HOME="$RUNNER_TEMP/peppy-home"
          mkdir -p "$PEPPY_HOME"
          PEPPY_MESSAGING_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          {
            echo "PEPPY_HOME=$PEPPY_HOME"
            echo "PEPPY_MESSAGING_PORT=$PEPPY_MESSAGING_PORT"
          } >> "$GITHUB_ENV"
          export PEPPY_HOME PEPPY_MESSAGING_PORT

          nohup peppy service serve --core-node-name "ci-index-$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/peppy-serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            if [ -f "$PEPPY_HOME/daemon_state.json5" ]; then exit 0; fi
            sleep 1
          done
          echo "daemon did not come up; serve log:" >&2
          cat "$RUNNER_TEMP/peppy-serve.log" >&2
          exit 1

      # The bundled defaults register the hub repositories, the contracts hub
      # among them; refreshing caches every contract an exposure here can
      # reference. The exposures themselves are read from the checkout by the
      # check, not from a registered copy, so the pull request's own bytes
      # are what gets validated.
      - name: Cache the contract repositories
        run: |
          set -euo pipefail
          peppy repo refresh

      - name: Check peppy_repository.json5 and every exposure it lists
        run: |
          set -euo pipefail
          peppy repo index . --check --validate-mcp-exposures

      # An exposure document is the whole artifact: the server that serves it
      # is built into peppy, and its catalog is derived on demand. A node
      # crate named after an exposure (`<exposure>_mcp/`) or a catalog file
      # (`*.bundle.json`) committed beside a document would serve nothing and
      # drift from it, so either one fails the pull request.
      - name: Refuse artifacts derived from an exposure
        run: |
          set -euo pipefail
          stray=$(find . -path ./.git -prune -o \( -name '*.bundle.json' -o -type d -name '*_mcp' \) -print)
          if [[ -n "$stray" ]]; then
            echo "only exposure documents belong in this repository; remove:" >&2
            echo "$stray" >&2
            exit 1
          fi
