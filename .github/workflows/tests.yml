name: Tests

# `peppy_repository.json5` states what this repository publishes: the
# `mcp_exposure/v1` documents a launcher can list. It is generated, so a pull
# request that adds, moves, renames or deletes an exposure leaves it stale
# unless the author regenerates it, and a stale index makes an exposure
# silently invisible to every machine that consumes this repository. The
# exposures themselves reference contracts that live in the contracts hub;
# an exposure selecting a member its contract does not declare, or breaking
# a policy rule, would only fail at launch. Both are caught here, on the
# branch of the person who caused them.
#
# It runs on every pull request rather than behind a path filter: a removal
# or a rename drifts the index just as an addition does.
#
# peppy and the sibling hubs come from the shared hub-ci-peppy action of the
# peppy repository, the one the CI of every hub installs peppy with. It pins
# each sibling hub, the contracts hub among them, at the commit of its branch
# named like the pull request's head branch where it has one, and at its main
# otherwise, so an exposure is checked against the contracts of a contracts
# hub change made on a branch of the same name. The job summary names the hub
# commits that ran.
#
# The job `python-tests` runs the repository's Python tests. pytest collects
# every test file under the checkout on its own, so a test added anywhere in
# the repository runs there without this file naming it.
#
# Each job runs on a RunsOn spot instance in attempts 1 and 2 of its run, and
# on an on-demand instance from attempt 3. When AWS interrupts a spot
# instance, RunsOn runs the failed jobs again in the next attempt, but only
# after attempt 1 or 2. A re-run is also an attempt, and the merge-set bot of
# peppy re-runs this workflow to test a new commit of another branch of its
# set. So each runs-on label adds spot=false from attempt 3, and AWS cannot
# interrupt a job that RunsOn does not run again.
#
# The last job, `test`, is the one status check the org ruleset requires on
# main. It is green only when every other job of this workflow succeeded or
# was skipped, so every check a pull request must pass is a job of this
# workflow. The merge-set bot of peppy knows this workflow by its name, Tests:
# the webhook of its App hands it the start and the end of each run.
on:
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The peppy dev build that the jobs below install. When peppy and this hub
  # are pushed at the same time, peppy's CI uploads that build several
  # minutes after this run starts. This job waits for it (see `wait-only` in
  # the hub-ci-peppy action), and each job that installs peppy needs this
  # job, so that only this small runner waits. A job whose peppy is a
  # release build waits for nothing.
  wait-for-peppy:
    name: Wait for the peppy dev build
    # The smallest RunsOn runner, 1 vCPU: the job only looks for the build.
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=1/ram=2+4/family=c8a+c7a+m8a+m7a${{ fromJSON(github.run_attempt) >= 3 && '/spot=false' || '' }}  # custom Peppy AMI
    # The action stops its wait after 20 minutes.
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Wait for the peppy dev build of the set
        uses: Peppy-bot/peppy/.github/actions/hub-ci-peppy@dev
        with:
          wait-only: true

  check-index:
    needs: wait-for-peppy
    # A light RunsOn runner: the check boots a daemon and clones the contract
    # repositories. A pull request from a fork runs on the same runners, so
    # what holds fork code is the repository's fork-PR approval gate.
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=4/ram=8+16/family=c8a+c7a+m8a+m7a${{ fromJSON(github.run_attempt) >= 3 && '/spot=false' || '' }}  # custom Peppy AMI
    # Nothing here legitimately takes minutes; a hung step should fail fast
    # rather than hold a runner for the default six hours.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Nothing here pushes, so the job has no use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # The action unpacks the whole peppy release archive under RUNNER_TEMP
      # and puts its bin on PATH: resolving the contracts the exposures
      # reference takes a daemon (`peppy repo refresh` runs in one), and the
      # daemon needs its bundled router beside the binary. It also exports a
      # PEPPY_HOME under RUNNER_TEMP and writes there the repository registry
      # the daemon below reads: every sibling hub pinned by commit, and this
      # checkout as the mcp-hub entry.
      - name: Install peppy and register the hub repositories
        uses: Peppy-bot/peppy/.github/actions/hub-ci-peppy@dev

      # The daemon runs a pre-flight check on the apptainer beside it and
      # refuses to start where unprivileged user namespaces are unavailable,
      # which on Ubuntu 24.04 means an AppArmor profile for the `starter`
      # binary of this install. The runner image keeps that restriction, so
      # the profile has to be installed. `peppy container setup` writes it
      # through sudo (stdin is not a terminal, so it applies rather than
      # prompts) and rechecks before exiting 0, and it is keyed to the
      # install's path under RUNNER_TEMP, so it grants nothing beyond this
      # run's binary. Needs the passwordless sudo the runner image grants.
      - name: Ready the bundled apptainer for unprivileged use
        run: peppy container setup

      # The daemon's data root is the PEPPY_HOME the action exported, where
      # the registry it wrote lives. The CLI finds the daemon through
      # PEPPY_HOME/daemon_state.json5, so the run's own directory is discovery
      # and isolation from any other daemon in one, and the daemon gets a port
      # of its own. The name carries the run id because core-node names must
      # be unique among daemons that can reach each other.
      - name: Start an isolated peppy daemon
        run: |
          set -euo pipefail
          PEPPY_MESSAGING_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          echo "PEPPY_MESSAGING_PORT=$PEPPY_MESSAGING_PORT" >> "$GITHUB_ENV"
          export PEPPY_MESSAGING_PORT

          nohup peppy service serve --core-node-name "ci-index-$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/peppy-serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            if [ -f "$PEPPY_HOME/daemon_state.json5" ]; then exit 0; fi
            sleep 1
          done
          echo "daemon did not come up; serve log:" >&2
          cat "$RUNNER_TEMP/peppy-serve.log" >&2
          exit 1

      # The registry names every sibling hub, the contracts hub among them;
      # refreshing caches every contract an exposure here can reference.
      # With --strict, a hub that CI cannot read fails this step instead of
      # leaving its contracts out of the check. The exposures themselves are
      # read from the checkout by the check, not from a registered copy, so
      # the pull request's own bytes are what gets validated.
      - name: Cache the contract repositories
        run: |
          set -euo pipefail
          peppy repo refresh --strict

      - name: Check peppy_repository.json5 and every exposure it lists
        run: |
          set -euo pipefail
          peppy repo index . --check --validate-mcp-exposures

      # An exposure document is the whole artifact: the server that serves it
      # is built into peppy, and its catalog is derived on demand. A node
      # crate named after an exposure (`<exposure>_mcp/`) or a catalog file
      # (`*.bundle.json`) committed beside a document would serve nothing and
      # drift from it, so either one fails the pull request.
      - name: Refuse artifacts derived from an exposure
        run: |
          set -euo pipefail
          stray=$(find . -path ./.git -prune -o \( -name '*.bundle.json' -o -type d -name '*_mcp' \) -print)
          if [[ -n "$stray" ]]; then
            echo "only exposure documents belong in this repository; remove:" >&2
            echo "$stray" >&2
            exit 1
          fi

  python-tests:
    # The smallest RunsOn runner: the tests bring their own stand-ins.
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=2/ram=4+8/family=c8a+c7a+m8a+m7a${{ fromJSON(github.run_attempt) >= 3 && '/spot=false' || '' }}  # custom Peppy AMI
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # A Python with pip, whatever the runner image ships beside its own
      # python3; 3.12 is what the client scripts run on (Ubuntu 24.04).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No path and no pattern: pytest walks the whole checkout (pytest.ini
      # lets it into dot-directories such as .github), so this step stays as
      # it is when tests are added. The tests bring their own stand-ins on
      # ephemeral loopback ports, so pytest is the only install, pinned to a
      # release so a run reproduces.
      - name: Run every Python test in the repository
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest==9.1.1
          python -m pytest --verbose

  # The one status check the org ruleset requires on main. It is green only
  # when every job above succeeded or was skipped, so a red job blocks the
  # merge whichever job it ran in.
  test:
    needs: [wait-for-peppy, check-index, python-tests]
    # Runs whatever happened above: on the default condition a failed or
    # cancelled job would leave this check unreported instead of red.
    if: always()
    # The smallest RunsOn runner: the job reads the results of the others.
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=2/ram=4+8/family=c8a+c7a+m8a+m7a${{ fromJSON(github.run_attempt) >= 3 && '/spot=false' || '' }}  # custom Peppy AMI
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Report every job's result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS"

      - name: Fail when any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
